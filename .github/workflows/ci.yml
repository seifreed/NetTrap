name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux:
    name: Build & Test (Linux ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            name: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libnetfilter-queue-dev libnfnetlink-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            sudo apt-get install -y iproute2 iptables nftables
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Check formatting (native only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo fmt --all -- --check

      - name: Run clippy (native only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests (native only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo test --all --target ${{ matrix.target }}

      - name: Build Docker image (x64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          tags: nettrap:test

      - name: Run integration tests (x64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm --entrypoint /bin/bash nettrap:test /app/integration_test.sh

      - name: Run protocol matrix smoke (x64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm --entrypoint /bin/bash nettrap:test /app/protocol_matrix_smoke.sh

      - name: Run network namespace interception E2E (x64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo env \
            NETTRAP_NAMESPACE_E2E=1 \
            NETTRAP_BIN="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/nettrap" \
            bash tests/network_namespace_e2e.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nettrap-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/nettrap

  build-macos:
    name: Build & Test (macOS ${{ matrix.target }})
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: macos-x64
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            name: macos-arm64
            runner: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install system dependencies
        run: |
          brew install libpcap

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --all --target ${{ matrix.target }}

      - name: Create config for testing
        run: |
          cat > /tmp/nettrap_config.toml << 'EOF'
          attribution_enabled = true
          attribution_timeout_ms = 5000
          default_decision = "intercept"
          pcap_enabled = false
          output_format = "jsonl"

          [[listeners]]
          name = "dns"
          protocol = "udp"
          port = 53530
          bind_address = "0.0.0.0"
          enabled = true
          emulate_response = true
          response_delay_ms = 0

          [[listeners]]
          name = "http"
          protocol = "tcp"
          port = 8088
          bind_address = "0.0.0.0"
          enabled = true
          emulate_response = true
          response_delay_ms = 0
          EOF

      - name: Run integration tests
        run: |
          set -euo pipefail
          ./target/${{ matrix.target }}/release/nettrap run -c /tmp/nettrap_config.toml &
          NETTRAP_PID=$!
          trap 'kill "$NETTRAP_PID" 2>/dev/null || true' EXIT
          sleep 3

          echo "=== macOS Integration Tests ==="
          dig @127.0.0.1 -p 53530 example.com A +short | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          curl --fail --silent --header 'Host: example.test' http://127.0.0.1:8088/ | grep -F 'It Works!'

          kill $NETTRAP_PID
          wait $NETTRAP_PID || true
          trap - EXIT

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nettrap-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/nettrap

  build-windows:
    name: Build & Test (Windows ${{ matrix.target }})
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: windows-x64
            arch: x64
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            name: windows-arm64
            arch: arm64
            runner: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Prepare Npcap SDK import libraries
        run: |
          $sdkArchive = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "npcap-sdk"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" -OutFile $sdkArchive
          Expand-Archive -Path $sdkArchive -DestinationPath $sdkRoot -Force
          $libDir = Join-Path $sdkRoot $(if ("${{ matrix.arch }}" -eq "arm64") { "Lib\ARM64" } else { "Lib\x64" })
          "LIB=$libDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBPCAP_LIBDIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Setup Npcap notice
        run: |
          Write-Host "::notice::Windows builds support listener mode and Npcap-backed capture"
          Write-Host "::notice::Transparent WinDivert interception is disabled"
          Write-Host "::notice::Install Npcap from https://nmap.org/npcap/"
        shell: pwsh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        if: matrix.arch != 'arm64'
        run: cargo test --all --target ${{ matrix.target }} -- --test-threads=1

      - name: Compile tests (Windows ARM64)
        if: matrix.arch == 'arm64'
        run: cargo test --all --target ${{ matrix.target }} --no-run

      - name: Create config for testing
        run: |
          @"
          attribution_enabled = true
          attribution_timeout_ms = 5000
          default_decision = "intercept"
          pcap_enabled = false
          output_format = "jsonl"

          [[listeners]]
          name = "dns"
          protocol = "udp"
          port = 53530
          bind_address = "0.0.0.0"
          enabled = true
          emulate_response = true
          response_delay_ms = 0

          [[listeners]]
          name = "http"
          protocol = "tcp"
          port = 8088
          bind_address = "0.0.0.0"
          enabled = true
          emulate_response = true
          response_delay_ms = 0
          "@ | Out-File -FilePath "config.toml" -Encoding utf8
        shell: pwsh

      - name: Smoke test runnable binary
        if: matrix.arch != 'arm64'
        run: |
          & "target/${{ matrix.target }}/release/nettrap.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "Windows binary --version failed with exit code $LASTEXITCODE"
          }
          $defaultsPath = Join-Path $env:RUNNER_TEMP "nettrap-defaults.toml"
          & "target/${{ matrix.target }}/release/nettrap.exe" config --defaults --output $defaultsPath
          if ($LASTEXITCODE -ne 0) {
            throw "Windows binary config --defaults failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $defaultsPath)) {
            throw "Windows binary config --defaults did not create $defaultsPath"
          }
        shell: pwsh

      - name: Run Windows listener parity smoke
        if: matrix.arch != 'arm64'
        run: ./tests/windows_listener_smoke.ps1 -BinaryPath "${{ github.workspace }}\target\${{ matrix.target }}\release\nettrap.exe"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nettrap-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/nettrap.exe
            config.toml

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
