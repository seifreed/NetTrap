name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux:
    name: Build & Test (Linux ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            name: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libnetfilter-queue-dev libnfnetlink-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            sudo apt-get install -y iproute2 iptables nftables
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-25)
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Check formatting (native only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo fmt --all -- --check

      - name: Run clippy (native only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests (native only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo test --all --target ${{ matrix.target }} -- --test-threads=1

      - name: Build Docker image (x64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: nettrap:test

      - name: Run integration tests (x64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm --entrypoint /bin/bash nettrap:test /app/integration_test.sh

      - name: Run protocol matrix smoke (x64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
            docker run --rm --entrypoint /bin/bash nettrap:test /app/protocol_matrix_smoke.sh

      - name: Generate Linux protocol matrix parity report
        env:
          NETTRAP_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/nettrap
          NETTRAP_MATRIX_REPORT: ${{ runner.temp }}/nettrap-protocol-matrix-${{ matrix.name }}.txt
        run: bash tests/protocol_matrix_smoke.sh

      - name: Upload Linux protocol matrix parity report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-matrix-${{ matrix.name }}
          path: ${{ runner.temp }}/nettrap-protocol-matrix-${{ matrix.name }}.txt
          if-no-files-found: error
          archive: false

      - name: Run network namespace interception E2E (x64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo env \
            NETTRAP_NAMESPACE_E2E=1 \
            NETTRAP_BIN="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/nettrap" \
            bash tests/network_namespace_e2e.sh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nettrap-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/nettrap

  build-macos:
    name: Build & Test (macOS ${{ matrix.target }})
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: macos-x64
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            name: macos-arm64
            runner: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          brew install libpcap

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-25)
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --all --target ${{ matrix.target }} -- --test-threads=1

      - name: Create config for testing
        run: |
          cat > /tmp/nettrap_config.toml << 'EOF'
          attribution_enabled = true
          attribution_timeout_ms = 5000
          default_decision = "intercept"
          pcap_enabled = false
          output_format = "jsonl"

          [[listeners]]
          name = "dns"
          protocol = "udp"
          port = 53530
          bind_address = "0.0.0.0"
          enabled = true
          emulate_response = true
          response_delay_ms = 0

          [[listeners]]
          name = "http"
          protocol = "tcp"
          port = 8088
          bind_address = "0.0.0.0"
          enabled = true
          emulate_response = true
          response_delay_ms = 0

          [[listeners]]
          name = "dns-tcp"
          protocol = "tcp"
          port = 53532
          bind_address = "127.0.0.1"
          enabled = true
          emulate_response = true

          [[listeners]]
          name = "dns-v6"
          protocol = "udp"
          port = 53531
          bind_address = "::1"
          enabled = true
          emulate_response = true

          [[listeners]]
          name = "http-v6"
          protocol = "tcp"
          port = 8089
          bind_address = "::1"
          enabled = true
          emulate_response = true
          EOF

      - name: Run integration tests
        run: |
          set -euo pipefail
          ./target/${{ matrix.target }}/release/nettrap run -c /tmp/nettrap_config.toml &
          NETTRAP_PID=$!
          trap 'kill "$NETTRAP_PID" 2>/dev/null || true' EXIT
          sleep 3

          echo "=== macOS Integration Tests ==="
          dig @127.0.0.1 -p 53530 example.com A +short | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          dig +tcp @127.0.0.1 -p 53532 example.com A +short | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          dig @::1 -p 53531 example.com A +short | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          curl --noproxy '*' --fail --silent --header 'Host: example.test' http://127.0.0.1:8088/ | grep -F 'It Works!'
          curl --noproxy '*' --fail --silent --header 'Host: example.test' 'http://[::1]:8089/' | grep -F 'It Works!'

          kill $NETTRAP_PID
          wait $NETTRAP_PID || true
          trap - EXIT

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nettrap-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/nettrap

  build-windows:
    name: Build & Test (Windows ${{ matrix.target }})
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: windows-x64
            arch: x64
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            name: windows-arm64
            arch: arm64
            runner: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Npcap SDK import libraries
        run: |
          $sdkArchive = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "npcap-sdk"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" -OutFile $sdkArchive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sdkArchive).Hash.ToLowerInvariant()
          if ($hash -ne "f0a8be7778ee3ae1b99bbbecb27a3ff0f6c111a4093f1c78c5c5a099607184db") {
            throw "Npcap SDK archive SHA-256 mismatch: $hash"
          }
          Expand-Archive -Path $sdkArchive -DestinationPath $sdkRoot -Force
          $libDir = Join-Path $sdkRoot $(if ("${{ matrix.arch }}" -eq "arm64") { "Lib\ARM64" } else { "Lib\x64" })
          "LIB=$libDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBPCAP_LIBDIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Prepare WinDivert runtime (x64)
        if: matrix.arch == 'x64'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "WinDivert-2.2.2-A.zip"
          $root = Join-Path $env:RUNNER_TEMP "WinDivert-2.2.2-A"
          $runtime = Join-Path $env:RUNNER_TEMP "nettrap-windivert"
          Invoke-WebRequest -Uri "https://reqrypt.org/download/WinDivert-2.2.2-A.zip" -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($hash -ne "63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15") {
            throw "WinDivert archive SHA-256 mismatch: $hash"
          }
          Expand-Archive -Path $archive -DestinationPath $root -Force
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item (Join-Path $root "WinDivert-2.2.2-A\x64\WinDivert.dll") $runtime
          Copy-Item (Join-Path $root "WinDivert-2.2.2-A\x64\WinDivert64.sys") $runtime
          foreach ($required in @("WinDivert.dll", "WinDivert64.sys")) {
            $path = Join-Path $runtime $required
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -le 0) {
              throw "WinDivert runtime file is missing or empty: $path"
            }
          }
          "PATH=$runtime;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Setup Npcap notice
        run: |
          Write-Host "::notice::Windows builds support listener mode and Npcap-backed capture"
          Write-Host "::notice::Windows x64 also includes experimental WinDivert TCP/UDP NAT redirection"
          Write-Host "::notice::Install Npcap from https://nmap.org/npcap/"
        shell: pwsh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-25)
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        run: |
          if ("${{ matrix.arch }}" -eq "arm64") {
            $env:RUSTFLAGS = "-C link-arg=/DELAYLOAD:wpcap.dll -C link-arg=/DEFAULTLIB:delayimp.lib"
          }
          cargo test --all --target ${{ matrix.target }} -- --test-threads=1
        shell: pwsh

      - name: Create config for testing
        run: |
          @"
          attribution_enabled = true
          attribution_timeout_ms = 5000
          default_decision = "intercept"
          pcap_enabled = false
          output_format = "jsonl"

          [[listeners]]
          name = "dns"
          protocol = "udp"
          port = 53530
          bind_address = "0.0.0.0"
          enabled = true
          emulate_response = true
          response_delay_ms = 0

          [[listeners]]
          name = "http"
          protocol = "tcp"
          port = 8088
          bind_address = "0.0.0.0"
          enabled = true
          emulate_response = true
          response_delay_ms = 0
          "@ | Out-File -FilePath "config.toml" -Encoding utf8
        shell: pwsh

      - name: Smoke test runnable binary
        if: matrix.arch != 'arm64'
        run: |
          & "target/${{ matrix.target }}/release/nettrap.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "Windows binary --version failed with exit code $LASTEXITCODE"
          }
          $defaultsPath = Join-Path $env:RUNNER_TEMP "nettrap-defaults.toml"
          & "target/${{ matrix.target }}/release/nettrap.exe" config --defaults --output $defaultsPath
          if ($LASTEXITCODE -ne 0) {
            throw "Windows binary config --defaults failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $defaultsPath)) {
            throw "Windows binary config --defaults did not create $defaultsPath"
          }
        shell: pwsh

      - name: Run Windows listener parity smoke
        run: ./tests/windows_listener_smoke.ps1 -BinaryPath "${{ github.workspace }}\target\${{ matrix.target }}\release\nettrap.exe"
        shell: pwsh

      - name: Run Windows protocol matrix parity smoke
        env:
          NETTRAP_MATRIX_REPEAT: ${{ github.event_name == 'schedule' && '32' || '2' }}
          NETTRAP_MATRIX_DURATION_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '0' }}
        run: ./tests/windows_protocol_matrix_smoke.ps1 -BinaryPath "${{ github.workspace }}\target\${{ matrix.target }}\release\nettrap.exe"
        shell: pwsh

      - name: Run Windows hostile soak
        env:
          NETTRAP_SOAK_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '60' }}
        run: ./tests/windows_soak_test.ps1 -BinaryPath "${{ github.workspace }}\target\${{ matrix.target }}\release\nettrap.exe"
        shell: pwsh

      - name: Generate Windows protocol matrix parity report
        env:
          NETTRAP_MATRIX_REPEAT: "1"
          NETTRAP_MATRIX_REPORT: ${{ runner.temp }}\nettrap-protocol-matrix-${{ matrix.name }}.txt
        run: ./tests/windows_protocol_matrix_smoke.ps1 -BinaryPath "${{ github.workspace }}\target\${{ matrix.target }}\release\nettrap.exe"
        shell: pwsh

      - name: Upload Windows protocol matrix parity report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-matrix-${{ matrix.name }}
          path: ${{ runner.temp }}\nettrap-protocol-matrix-${{ matrix.name }}.txt
          if-no-files-found: error
          archive: false

      - name: Run Windows interception smoke (x64)
        if: matrix.arch == 'x64'
        env:
          NETTRAP_REQUIRE_WINDIVERT_NETWORK: ${{ runner.environment == 'self-hosted' && '1' || '0' }}
        run: ./tests/windows_interception_smoke.ps1 -BinaryPath "${{ github.workspace }}\target\${{ matrix.target }}\release\nettrap.exe"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nettrap-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/nettrap.exe
            config.toml

  protocol-parity:
    name: Verify Linux/Windows protocol parity
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download protocol matrix reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: protocol-matrix-*
          path: reports
          merge-multiple: true

      - name: Compare protocol matrix contracts
        run: python3 tests/compare_protocol_matrix_reports.py \
          reports/nettrap-protocol-matrix-linux-x64.txt \
          reports/nettrap-protocol-matrix-linux-arm64.txt \
          reports/nettrap-protocol-matrix-windows-x64.txt \
          reports/nettrap-protocol-matrix-windows-arm64.txt

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-25)
        with:
          toolchain: 1.97.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit
