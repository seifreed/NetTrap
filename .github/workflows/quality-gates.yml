name: Quality Gates

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libnetfilter-queue-dev libnfnetlink-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: quality-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            quality-${{ runner.os }}-cargo-

      - name: Install quality tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Run security audit
        run: cargo audit

      - name: Run dependency policy checks
        run: cargo deny check

      - name: Check architecture dependency direction
        run: scripts/check-architecture.sh

  lockfile-and-diff:
    name: Lockfile and Diff Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libnetfilter-queue-dev libnfnetlink-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hygiene-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            hygiene-${{ runner.os }}-cargo-

      - name: Validate lockfile resolution
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check all targets and features
        run: cargo check --all-targets --all-features

      - name: Check whitespace errors
        run: git diff --check

      - name: Ensure Cargo.lock is unchanged
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            echo "::error::Cargo.lock changed during quality gates. Commit the lockfile update."
            git diff -- Cargo.lock
            exit 1
          fi

  scheduled-heavy-gates:
    name: Scheduled Heavy Gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libnetfilter-queue-dev libnfnetlink-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: heavy-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            heavy-${{ runner.os }}-cargo-

      - name: Install heavy quality tools
        run: |
          cargo install cargo-udeps --locked
          cargo install cargo-tarpaulin --locked
          cargo install cargo-fuzz --locked
          cargo install cargo-semver-checks --locked
          cargo install cargo-outdated --locked

      - name: Check unused dependencies
        run: cargo +nightly udeps --all-targets --all-features

      - name: Run coverage report
        run: |
          mkdir -p target/quality-gates/coverage
          cargo tarpaulin --fail-under 70 --out Xml --out Html --output-dir target/quality-gates/coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-reports
          path: |
            target/quality-gates/coverage/cobertura.xml
            target/quality-gates/coverage/tarpaulin-report.html

      - name: Build fuzz targets
        run: cargo +nightly fuzz build

      - name: Check public API compatibility
        run: |
          baseline="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || printf 'HEAD^')"
          cargo +nightly semver-checks --workspace --baseline-rev "$baseline"

      - name: Run every fuzz target
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=10
          done

      - name: Run benchmarks
        run: cargo bench --no-fail-fast

      - name: Check outdated dependencies
        run: cargo outdated
