name: Quality Gates

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libnetfilter-queue-dev libnfnetlink-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-25)
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: quality-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            quality-${{ runner.os }}-cargo-

      - name: Install quality tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test -- --test-threads=1

      - name: Run security audit
        run: cargo audit

      - name: Run dependency policy checks
        run: cargo deny check

      - name: Check architecture dependency direction
        run: scripts/check-architecture.sh

  lockfile-and-diff:
    name: Lockfile and Diff Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libnetfilter-queue-dev libnfnetlink-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-25)
        with:
          toolchain: 1.97.1

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hygiene-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            hygiene-${{ runner.os }}-cargo-

      - name: Validate lockfile resolution
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check all targets and features
        run: cargo check --all-targets --all-features

      - name: Check whitespace errors
        run: git diff --check

      - name: Ensure Cargo.lock is unchanged
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            echo "::error::Cargo.lock changed during quality gates. Commit the lockfile update."
            git diff -- Cargo.lock
            exit 1
          fi

  scheduled-heavy-gates:
    name: Scheduled Heavy Gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_call'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libnetfilter-queue-dev libnfnetlink-dev curl dnsutils netcat-openbsd python3

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-25)
        with:
          toolchain: 1.97.1

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly (2026-08-25)

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: heavy-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            heavy-${{ runner.os }}-cargo-

      - name: Install heavy quality tools
        run: |
          cargo install cargo-udeps --locked
          cargo install cargo-tarpaulin --locked
          cargo install cargo-fuzz --locked
          cargo install cargo-semver-checks --locked
          cargo install cargo-outdated --locked

      - name: Check unused dependencies
        run: cargo +nightly udeps --all-targets --all-features

      - name: Run coverage report
        run: |
          mkdir -p target/quality-gates/coverage
          cargo tarpaulin --fail-under 70 --out Xml --out Html --output-dir target/quality-gates/coverage -- --test-threads=1

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            target/quality-gates/coverage/cobertura.xml
            target/quality-gates/coverage/tarpaulin-report.html

      - name: Build fuzz targets
        run: cargo +nightly fuzz build

      - name: Check public API compatibility
        run: |
          baseline="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || printf 'HEAD^')"
          cargo +nightly semver-checks --workspace --baseline-rev "$baseline"

      - name: Run every fuzz target
        env:
          NETTRAP_FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '60' || '10' }}
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- "-max_total_time=$NETTRAP_FUZZ_SECONDS"
          done

      - name: Build release binary for soak test
        run: cargo build --release --locked -p nettrap-cli

      - name: Run bounded runtime soak
        env:
          NETTRAP_SOAK_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '60' }}
        run: bash tests/soak_test.sh

      - name: Run repeated protocol matrix soak
        env:
          NETTRAP_BIN: ./target/release/nettrap
          NETTRAP_MATRIX_REPEAT: ${{ github.event_name == 'schedule' && '32' || '2' }}
          NETTRAP_MATRIX_DURATION_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '0' }}
        run: bash tests/protocol_matrix_smoke.sh

      - name: Run benchmarks
        run: |
          mkdir -p target/criterion
          rustc -Vv > target/criterion/environment.txt
          cargo -V >> target/criterion/environment.txt
          uname -a >> target/criterion/environment.txt
          cargo bench --no-fail-fast

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion
          if-no-files-found: error
          retention-days: 30

      - name: Check outdated dependencies
        run: cargo outdated
