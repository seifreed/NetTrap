services:
  nettrap-node1:
    build: .
    container_name: nettrap-node1
    ports:
      - "1053:5353/udp"
      - "${NETTRAP_NODE1_HTTP_PORT:-8080}:8080"
      - "2222:2222"
      - "2323:2323"
      - "9091:9090"
      - "9191:9091"
    volumes:
      - ./config/node1.toml:/etc/nettrap/config.toml:ro
      - pcap-node1:/var/lib/nettrap/pcap
      - logs-node1:/var/log/nettrap
    environment:
      - NETTRAP_NODE_REGION=local
      - NETTRAP_NODE_TAGS=node1,primary
    networks:
      - nettrap-net

  nettrap-node2:
    build: .
    container_name: nettrap-node2
    ports:
      - "1054:5353/udp"
      - "8081:8080"
      - "2223:2222"
      - "2324:2323"
      - "9092:9090"
      - "9192:9091"
    volumes:
      - ./config/node2.toml:/etc/nettrap/config.toml:ro
      - pcap-node2:/var/lib/nettrap/pcap
      - logs-node2:/var/log/nettrap
    environment:
      - NETTRAP_NODE_REGION=local
      - NETTRAP_NODE_TAGS=node2,secondary
    networks:
      - nettrap-net

volumes:
  pcap-node1:
  pcap-node2:
  logs-node1:
  logs-node2:

networks:
  nettrap-net:
    driver: bridge
