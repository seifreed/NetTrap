version: '3.8'

services:
  nettrap-node1:
    build: .
    container_name: nettrap-node1
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "5353:5353/udp"
      - "8080:8080"
      - "2222:2222"
      - "2323:2323"
      - "9091:9090"
    volumes:
      - ./config/node1.toml:/etc/nettrap/config.toml
      - pcap-node1:/var/lib/nettrap/pcap
    environment:
      - NETTRAP_NODE_REGION=local
      - NETTRAP_NODE_TAGS=node1,primary
    networks:
      - nettrap-net

  nettrap-node2:
    build: .
    container_name: nettrap-node2
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "5354:5353/udp"
      - "8081:8080"
      - "2223:2222"
      - "2324:2323"
      - "9092:9090"
    volumes:
      - ./config/node2.toml:/etc/nettrap/config.toml
      - pcap-node2:/var/lib/nettrap/pcap
    environment:
      - NETTRAP_NODE_REGION=local
      - NETTRAP_NODE_TAGS=node2,secondary
    networks:
      - nettrap-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: nettrap-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - nettrap-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: nettrap-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - nettrap-net

volumes:
  pcap-node1:
  pcap-node2:
  es-data:

networks:
  nettrap-net:
    driver: bridge
