attribution_enabled = false
attribution_timeout_ms = 5000
default_decision = "intercept"
pcap_enabled = false
output_format = "jsonl"

[[listeners]]
name = "dns"
protocol = "udp"
port = 5353
bind_address = "0.0.0.0"
enabled = true
emulate_response = true
response_delay_ms = 0

[[listeners]]
name = "http"
protocol = "tcp"
port = 8080
bind_address = "0.0.0.0"
enabled = true
emulate_response = true
response_delay_ms = 0

[[listeners]]
name = "ssh"
protocol = "tcp"
port = 2222
bind_address = "0.0.0.0"
enabled = true
emulate_response = true
response_delay_ms = 0

[[listeners]]
name = "telnet"
protocol = "tcp"
port = 2323
bind_address = "0.0.0.0"
enabled = true
emulate_response = true
response_delay_ms = 0

[distributed]
enabled = false
