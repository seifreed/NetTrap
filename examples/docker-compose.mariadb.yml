# NetTrap + MariaDB (standalone)
# Usage: docker compose -f examples/docker-compose.mariadb.yml up -d
#
# Access:
#   - MariaDB: localhost:3307 (nettrap/nettrap_password)
#   - NetTrap health: http://localhost:9091/health
#   - NetTrap HTTP: http://localhost:18080

services:
  mariadb:
    image: mariadb:11.2
    container_name: nettrap-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nettrap
      MYSQL_USER: nettrap
      MYSQL_PASSWORD: nettrap_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - nettrap
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  nettrap:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nettrap-mariadb-node
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "15353:5353/udp"
      - "18080:8080"
      - "12222:2222"
      - "9091:9090"
    volumes:
      - ./config-mariadb.toml:/etc/nettrap/config.toml:ro
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - nettrap

volumes:
  mariadb-data:

networks:
  nettrap:
    driver: bridge
