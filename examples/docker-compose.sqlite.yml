
services:
  nettrap:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nettrap-sqlite
    ports:
      - "15353:5353/udp"
      - "18080:8080"
      - "12222:2222"
      - "9091:9090"
    volumes:
      - ./config-sqlite.toml:/etc/nettrap/config.toml:ro
      - sqlite-data:/var/lib/nettrap
      - nettrap-sqlite-logs:/var/log/nettrap
    networks:
      - nettrap

volumes:
  sqlite-data:
  nettrap-sqlite-logs:

networks:
  nettrap:
    driver: bridge
