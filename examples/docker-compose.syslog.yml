
services:
  syslog:
    image: debian:bookworm-slim
    container_name: nettrap-syslog
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq socat > /dev/null 2>&1 &&
      echo 'Syslog receiver on UDP 514...' &&
      socat -u UDP-LISTEN:514,fork,reuseaddr OPEN:/var/log/nettrap-syslog.log,creat,append"
    ports:
      - "1514:514/udp"
    volumes:
      - syslog-data:/var/log
    networks:
      - nettrap

  nettrap:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nettrap-syslog-node
    ports:
      - "15353:5353/udp"
      - "18080:8080"
      - "12222:2222"
      - "12323:2323"
      - "9091:9090"
    volumes:
      - ./config-syslog.toml:/etc/nettrap/config.toml:ro
      - nettrap-syslog-logs:/var/log/nettrap
    depends_on:
      - syslog
    networks:
      - nettrap

volumes:
  syslog-data:
  nettrap-syslog-logs:

networks:
  nettrap:
    driver: bridge
