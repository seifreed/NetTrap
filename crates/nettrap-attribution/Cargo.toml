[package]
name = "nettrap-attribution"
description = "Process attribution engine for NetTrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nettrap-core.workspace = true
chrono.workspace = true
parking_lot.workspace = true
dashmap.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
