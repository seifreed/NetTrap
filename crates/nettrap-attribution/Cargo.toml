[package]
name = "nettrap-attribution"
description = "Process attribution engine for NetTrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nettrap-core.workspace = true
nettrap-flow.workspace = true
thiserror.workspace = true
serde.workspace = true
chrono.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
hashbrown.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }