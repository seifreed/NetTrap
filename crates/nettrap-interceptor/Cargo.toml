[package]
name = "nettrap-interceptor"
description = "Network interception for NetTrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nettrap-core.workspace = true
thiserror.workspace = true
serde.workspace = true
bytes.workspace = true
chrono.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait.workspace = true
socket2.workspace = true
pcap.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["net", "socket", "ioctl", "user"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }
nettrap-windivert = { path = "../nettrap-windivert" }

[features]
default = ["userspace"]
userspace = []
ebpf = []
native-capture-tests = []
