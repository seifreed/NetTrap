apiVersion: v1
kind: Service
metadata:
  name: nettrap
  labels:
    app: nettrap
spec:
  type: LoadBalancer
  ports:
  - port: 53
    targetPort: 5353
    protocol: UDP
    name: dns
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8443
    protocol: TCP
    name: https
  - port: 25
    targetPort: 2525
    protocol: TCP
    name: smtp
  - port: 21
    targetPort: 2121
    protocol: TCP
    name: ftp
  - port: 22
    targetPort: 2222
    protocol: TCP
    name: ssh
  - port: 23
    targetPort: 2323
    protocol: TCP
    name: telnet
  selector:
    app: nettrap
---
apiVersion: v1
kind: Service
metadata:
  name: nettrap-metrics
  labels:
    app: nettrap
    component: metrics
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: nettrap
