apiVersion: v1
kind: ConfigMap
metadata:
  name: nettrap-config
data:
  config.toml: |
    attribution_enabled = true
    attribution_timeout_ms = 5000
    default_decision = "emulate"
    pcap_enabled = true
    pcap_path = "/var/lib/nettrap/pcap/capture.pcap"
    output_format = "jsonl"
    output_path = "/var/lib/nettrap/events.jsonl"

    [[listeners]]
    name = "dns"
    protocol = "udp"
    port = 5353
    bind_address = "0.0.0.0"
    enabled = true
    emulate_response = true
    response_delay_ms = 0

    [[listeners]]
    name = "http"
    protocol = "tcp"
    port = 8080
    bind_address = "0.0.0.0"
    enabled = true
    emulate_response = true
    response_delay_ms = 0

    [[listeners]]
    name = "ldap"
    protocol = "tcp"
    port = 1389
    bind_address = "0.0.0.0"
    enabled = true
    emulate_response = true
    response_delay_ms = 0

    [[listeners]]
    name = "ssh"
    protocol = "tcp"
    port = 2222
    bind_address = "0.0.0.0"
    enabled = true
    emulate_response = true
    response_delay_ms = 0

    [[listeners]]
    name = "telnet"
    protocol = "tcp"
    port = 2323
    bind_address = "0.0.0.0"
    enabled = true
    emulate_response = true
    response_delay_ms = 0

    [distributed]
    enabled = true
    health_bind = "0.0.0.0:9090"
    metrics_bind = "0.0.0.0:9091"
    heartbeat_interval_secs = 0
